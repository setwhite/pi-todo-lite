name: npm publish

# 发版：main 上 package.json 变了（版本号随之变）就发，也可以手动 dispatch 一次。
# 走 OIDC 可信发布 —— 不用 NPM_TOKEN，但两处必须同时成立：
#   1. 这里给 id-token: write；
#   2. npm 包设置的 Trusted Publisher 里填的 workflow 文件名与本文件一致（npm-publish.yml）。
on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node 24 自带 npm ≥ 11.5.1，这是 OIDC 的硬要求（Node 22 的 npm 10.9.9 不够）
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: 查 npm 上有没有这个版本
        id: check
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "pi-todo-lite@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pi-todo-lite@$version 已在 npm 上，跳过发布"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::pi-todo-lite@$version 还没发布，准备发布"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.publish == 'true'
        run: pnpm lint && pnpm check:imports && pnpm typecheck && pnpm test
      # 发布前的最后一道：真实 tarball 必须覆盖 files 的每一项与 pi.extensions 的入口。
      - name: 断言 tarball 覆盖 files
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          pnpm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json");
            const raw = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"));
            const packed = (Array.isArray(raw) ? raw[0] : raw).files.map((f) => f.path);
            const missing = pkg.files.filter((e) => !packed.some((p) => p === e || p.startsWith(e + "/")));
            if (missing.length > 0) throw new Error("tarball 缺 files 条目: " + missing.join(", "));
            const entry = pkg.pi.extensions[0].replace("./", "");
            if (!packed.includes(entry)) throw new Error("tarball 缺入口: " + entry);
            console.log("tarball " + packed.length + " files, files 全覆盖, 入口在");
          '
      # OIDC 由 npm CLI 自己识别，provenance 也随之自动生成，不需要额外 flag
      - if: steps.check.outputs.publish == 'true'
        run: npm publish
